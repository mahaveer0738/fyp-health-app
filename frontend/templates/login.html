<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexaCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest:     #1B3D2F;
            --forest-l:   #2A5A42;
            --cream:      #F5F0E8;
            --cream-d:    #EDE7DB;
            --lime:       #C8E64A;
            --lime-d:     #B0CC2E;
            --white:      #FFFFFF;
            --text-muted: #5A7A6A;
            --border:     #D8D0C4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--cream);
            color: var(--forest);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
        }

        .nav-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 700; font-size: 1.8rem;
            color: var(--forest);
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; margin-bottom: 2.5rem;
        }
        .nav-brand-dot {
            width: 12px; height: 12px; background: var(--lime);
            border-radius: 50%; display: inline-block;
        }

        .container {
            background-color: var(--white);
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(27,61,47,0.08);
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
        }

        .header { text-align: center; margin-bottom: 2.5rem; }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;
            color: var(--forest);
        }
        .header p { color: var(--text-muted); font-size: 0.95rem; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block; font-size: 0.9rem; font-weight: 700;
            margin-bottom: 0.5rem; color: var(--forest);
        }
        .form-group input {
            width: 100%; padding: 0.85rem 1rem;
            background: var(--cream-d);
            border: 1px solid transparent;
            border-radius: 0.75rem; font-size: 1rem;
            color: var(--forest); font-family: 'DM Sans', sans-serif;
            transition: all 0.2s ease;
        }
        .form-group input::placeholder { color: var(--text-muted); opacity: 0.7; }
        .form-group input:focus {
            outline: none; background: var(--white);
            border-color: var(--lime);
            box-shadow: 0 0 0 4px rgba(200, 230, 74, 0.2);
        }

        .btn {
            width: 100%; padding: 0.9rem;
            background-color: var(--forest); color: var(--white);
            border: none; border-radius: 50px;
            font-size: 1.05rem; font-weight: 700;
            cursor: pointer; font-family: inherit;
            transition: all 0.25s ease;
            margin-top: 0.5rem;
        }
        .btn:hover { background-color: var(--lime); color: var(--forest); transform: translateY(-2px); }

        .footer {
            text-align: center; margin-top: 2rem;
            font-size: 0.9rem; color: var(--text-muted);
        }
        .footer a {
            color: var(--forest); text-decoration: none; font-weight: 700;
            transition: color 0.2s; border-bottom: 2px solid transparent;
        }
        .footer a:hover { color: var(--lime-d); border-bottom-color: var(--lime-d); }

        .error-message {
            color: #dc2626; font-size: 0.875rem; font-weight: 500;
            margin-top: 0.5rem; text-align: center; display: none;
            background: #fef2f2; padding: 0.5rem; border-radius: 0.5rem;
        }
    </style>
</head>
<body>

<a href="index.html" class="nav-brand">
    <img src="../Icons/LOGO.png" alt="NexaCare Logo" style="height: 56px; width: auto; margin-right: 4px; vertical-align: middle; border-radius: 4px;">NexaCare
</a>

<div class="container">
    <div class="header">
        <h1>Welcome Back</h1>
        <p>Login to your healthcare dashboard</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="username" required placeholder="you@example.com">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <div class="error-message" id="errorMessage">Invalid email or password</div>

        <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="footer">
        Don't have an account? <a href="register.html">Sign up</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');
        
        const formData = new URLSearchParams();
        formData.append('username', email);
        formData.append('password', password);

        try {
            // Adjust port to match FastAPI (default 8000)
            const response = await fetch('http://localhost:8000/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('access_token', data.access_token);
                
                // Fetch user profile to get the actual name for the DP
                try {
                    const profileRes = await fetch('http://localhost:8000/user/history', {
                        headers: { 'Authorization': `Bearer ${data.access_token}` }
                    });
                    if (profileRes.ok) {
                        const profileData = await profileRes.json();
                        if(profileData.profile) {
                            localStorage.setItem('user_name', profileData.profile.name);
                            localStorage.setItem('user_email', profileData.profile.email);
                        }
                    }
                } catch(e) { console.warn("Could not fetch profile info"); }

                window.location.href = 'mode_select.html';
            } else {
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Invalid email or password';
            }
        } catch (error) {
            errorMessage.style.display = 'block';
            errorMessage.textContent = 'Server error. Is the backend running?';
        }
    });
</script>

</body>
</html>
