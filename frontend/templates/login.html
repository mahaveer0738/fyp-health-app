<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexaCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest:     #1B3D2F;
            --forest-l:   #345946;
            --white:      #FFFFFF;
            --text-muted: #5A7A6A;
            --border:     #D8D0C4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: url('../soft_leaves.jpg') center/cover no-repeat fixed;
            color: var(--forest);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            /* A subtle backdrop filter if supported */
            backdrop-filter: blur(8px);
        }

        .split-card {
            background-color: var(--white);
            border-radius: 2rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 1000px;
            height: 650px;
            display: flex;
            position: relative;
            overflow: hidden;
            background: url('../dark_leaves.jpg') right/cover no-repeat;
        }

        /* The white form area */
        .form-area {
            width: 45%;
            height: 100%;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 2rem 4rem;
        }

        .brand-logo {
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .brand-logo img {
            height: 80px;
            width: auto;
        }

        .form-area h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 2.2rem; font-weight: 700; margin-bottom: 2rem;
            color: var(--forest);
            text-align: center;
        }

        .form-group { margin-bottom: 1.2rem; position: relative; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 700;
            margin-bottom: 0.4rem; color: var(--text-muted);
        }
        .form-group input {
            width: 100%; padding: 0.9rem 1.2rem;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 50px; font-size: 0.95rem;
            color: var(--forest); font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none; border-color: var(--forest);
            box-shadow: 0 0 0 4px rgba(27,61,47, 0.1);
        }
        .eye-icon {
            position: absolute; right: 18px; top: 34px;
            cursor: pointer; opacity: 0.5; transition: opacity 0.2s;
        }
        .eye-icon:hover { opacity: 1; }

        .btn {
            width: 100%; padding: 1rem;
            background-color: var(--forest-l); color: var(--white);
            border: none; border-radius: 50px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; font-family: inherit;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 8px 20px rgba(27,61,47,0.2);
        }
        .btn:hover { background-color: var(--forest); transform: translateY(-2px); box-shadow: 0 12px 25px rgba(27,61,47,0.3); }

        .divider {
            display: flex; align-items: center; text-align: center; margin: 1.5rem 0;
            color: var(--text-muted); font-size: 0.85rem; font-weight: 500;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid var(--border);
        }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .social-logins {
            display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.5rem;
        }
        .social-btn {
            width: 45px; height: 45px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--white);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .social-btn:hover { border-color: var(--forest); transform: translateY(-2px); }
        .social-btn img { width: 24px; height: 24px; }

        .footer-link {
            text-align: center; font-size: 0.85rem; color: #4FA88F; font-weight: 600; text-decoration: none; transition: color 0.2s;
            display: block; margin-top: 10px;
        }
        .footer-link:hover { color: var(--forest); }
        .footer-link-bottom { display: block; text-align: center; margin-top: 1rem; font-size: 0.9rem; color: var(--text-muted); }
        .footer-link-bottom a { color: var(--forest); font-weight: 700; text-decoration: none; }

        /* Highly Detailed Paper Cut SVG Mask */
        .paper-mask {
            position: absolute;
            left: 0; top: 0;
            width: 75%; /* Shifted to the right to prevent overlap with inputs */
            height: 100%;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through to the form */
        }
        .paper-mask svg {
            width: 100%; height: 100%; display: block;
        }

        @media (max-width: 768px) {
            .split-card { max-width: 450px; height: auto; flex-direction: column; background: var(--white); }
            .form-area { width: 100%; padding: 3rem 2rem; z-index: 10; }
            .paper-mask { display: none; }
        }
    </style>
</head>
<body>

    <div class="split-card">
        
        <!-- Intricate Paper Cut SVG Background for the Left Side -->
        <div class="paper-mask">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                    <!-- Deep drop shadows casting to the RIGHT to simulate cutout depth -->
                    <filter id="shadow1" x="-20%" y="-20%" width="150%" height="150%">
                        <feDropShadow dx="3" dy="0" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
                    </filter>
                    <filter id="shadow2" x="-20%" y="-20%" width="150%" height="150%">
                        <feDropShadow dx="6" dy="0" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
                    </filter>
                    <filter id="shadow3" x="-20%" y="-20%" width="150%" height="150%">
                        <feDropShadow dx="10" dy="0" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
                    </filter>
                </defs>
                
                <!-- We draw the white shapes starting from X=0 (left) and extending to the right. -->
                
                <!-- Bottom Step (Darkest/Deepest, extends furthest right) -->
                <path d="M0,0 L85,0 C95,15 65,30 85,50 C105,70 65,85 85,100 L0,100 Z" fill="#D8E0DC" filter="url(#shadow1)"/>
                
                <!-- Middle Step -->
                <path d="M0,0 L78,0 C92,18 55,35 78,55 C100,75 55,88 78,100 L0,100 Z" fill="#E8EFEA" filter="url(#shadow2)"/>
                
                <!-- Top Step (Pure White, holds the form) -->
                <path d="M0,0 L70,0 C85,20 45,40 70,60 C95,80 45,92 70,100 L0,100 Z" fill="#FFFFFF" filter="url(#shadow3)"/>
            </svg>
        </div>

        <!-- Left: Form Area -->
        <div class="form-area">
            <div class="brand-logo">
                <img src="../Icons/LOGO.png" alt="NexaCare Logo">
            </div>

            <h1>Log in</h1>
            <form id="login-form">
                <div class="form-group">
                    <label>Login, email or phone number</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" required>
                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </div>
                <button type="submit" class="btn">Log in</button>
            </form>

            <div class="divider">or log in with</div>

            <div class="social-logins">
                <div class="social-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                </div>
                <div class="social-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#ea3e23" d="M22.5 12c0 5.799-4.701 10.5-10.5 10.5S1.5 17.799 1.5 12 6.201 1.5 12 1.5 22.5 6.201 22.5 12z"/><path fill="#fff" d="M10.224 8.769v6.521c0 .245.195.445.441.445h1.564c.247 0 .441-.2.441-.445v-2.316l3.398 2.535a.442.442 0 0 0 .708-.354v-6.31a.443.443 0 0 0-.708-.355l-3.398 2.536V8.769c0-.245-.194-.444-.441-.444h-1.564c-.246 0-.441.199-.441.444z"/></svg>
                </div>
            </div>

            <div class="footer-link-bottom">Don't have an account? <a href="register.html">Sign up</a></div>
        </div>

    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            localStorage.setItem('access_token', 'dummy_token');
            localStorage.setItem('user_name', 'Dr. Smith');
            window.location.href = 'mode_select.html';
        });
    </script>
</body>
</html>
