<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NexaCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest:     #1B3D2F;
            --forest-l:   #2A5A42;
            --cream:      #F5F0E8;
            --cream-d:    #EDE7DB;
            --lime:       #C8E64A;
            --lime-d:     #B0CC2E;
            --white:      #FFFFFF;
            --text-muted: #5A7A6A;
            --border:     #D8D0C4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--cream);
            color: var(--forest);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .nav-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 700; font-size: 1.8rem;
            color: var(--forest);
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; margin-bottom: 0.5rem;
        }
        .nav-brand-dot {
            width: 12px; height: 12px; background: var(--lime);
            border-radius: 50%; display: inline-block;
        }

        .container {
            background-color: var(--white);
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(27,61,47,0.08);
            width: 100%;
            max-width: 540px;
            border: 1px solid var(--border);
        }

        .header { text-align: center; margin-bottom: 2.5rem; }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;
            color: var(--forest);
        }
        .header p { color: var(--text-muted); font-size: 0.95rem; }

        .form-group { margin-bottom: 1.5rem; }
        
        .form-row {
            display: flex; gap: 1.5rem; margin-bottom: 1.5rem;
        }
        .form-row .form-group { flex: 1; margin-bottom: 0; }

        .form-group label {
            display: block; font-size: 0.9rem; font-weight: 700;
            margin-bottom: 0.5rem; color: var(--forest);
        }
        .form-group input, .form-group select {
            width: 100%; padding: 0.85rem 1rem;
            background: var(--cream-d);
            border: 1px solid transparent;
            border-radius: 0.75rem; font-size: 1rem;
            color: var(--forest); font-family: 'DM Sans', sans-serif;
            transition: all 0.2s ease;
        }
        .form-group input::placeholder { color: var(--text-muted); opacity: 0.7; }
        .form-group input:focus, .form-group select:focus {
            outline: none; background: var(--white);
            border-color: var(--lime);
            box-shadow: 0 0 0 4px rgba(200, 230, 74, 0.2);
        }

        .btn {
            width: 100%; padding: 0.9rem;
            background-color: var(--forest); color: var(--white);
            border: none; border-radius: 50px;
            font-size: 1.05rem; font-weight: 700;
            cursor: pointer; font-family: inherit;
            transition: all 0.25s ease;
            margin-top: 0.5rem;
        }
        .btn:hover { background-color: var(--lime); color: var(--forest); transform: translateY(-2px); }

        .footer {
            text-align: center; margin-top: 2rem;
            font-size: 0.9rem; color: var(--text-muted);
        }
        .footer a {
            color: var(--forest); text-decoration: none; font-weight: 700;
            transition: color 0.2s; border-bottom: 2px solid transparent;
        }
        .footer a:hover { color: var(--lime-d); border-bottom-color: var(--lime-d); }

        .error-message, .success-message {
            font-size: 0.9rem; font-weight: 500;
            margin-top: 0.5rem; margin-bottom: 1.5rem;
            text-align: center; display: none;
            padding: 0.5rem; border-radius: 0.5rem;
        }
        .error-message { color: #dc2626; background: #fef2f2; }
        .success-message { color: #16a34a; background: #f0fdf4; }
    </style>
</head>
<body>

<a href="index.html" class="nav-brand">
    <img src="../Icons/LOGO.png" alt="NexaCare Logo" style="height: 96px; width: auto; vertical-align: middle;">
</a>

<div class="container">
    <div class="header">
        <h1>Create Account</h1>
        <p>Set up your patient profile for personalized care</p>
    </div>

    <form id="registerForm">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" required min="1" max="120" placeholder="30">
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="" disabled selected>Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="conditions">Chronic Conditions (Optional)</label>
            <input type="text" id="conditions" placeholder="e.g., Diabetes, Hypertension">
        </div>

        <div class="error-message" id="errorMessage">Registration failed.</div>
        <div class="success-message" id="successMessage">Registration successful! Redirecting...</div>

        <button type="submit" class="btn">Create Account</button>
    </form>

    <div class="footer">
        Already have an account? <a href="login.html">Sign in</a>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        errorMessage.style.display = 'none';
        successMessage.style.display = 'none';
        
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            age: parseInt(document.getElementById('age').value),
            gender: document.getElementById('gender').value,
            chronic_conditions: document.getElementById('conditions').value || null
        };

        try {
            const response = await fetch('http://localhost:8000/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                successMessage.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                const data = await response.json();
                errorMessage.style.display = 'block';
                errorMessage.textContent = data.detail || 'Registration failed';
            }
        } catch (error) {
            errorMessage.style.display = 'block';
            errorMessage.textContent = 'Server error. Is the backend running?';
        }
    });
</script>

</body>
</html>
